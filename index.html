<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1724">
  <meta name="description" content="Secure Password Generator with cryptographic randomness, entropy calculation and strength meter.">
  <title>Password Generator</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container" role="main">
    <h1 id="title">Secure Password Generator</h1>

    <div class="controls" aria-labelledby="title">

      <div class="row">
        <label for="length">Password length</label>
        <span class="spacer"></span>
        <span>Password length: <strong id="lengthValue">16</strong></span>
        <input id="length" name="length" type="range" min="4" max="64" value="16" aria-describedby="lengthValue">
      </div>

      <fieldset class="row">
        <legend>Include</legend>
        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
        <label><input type="checkbox" id="symbols"> Symbols</label>
      </fieldset>

      <div class="row password-row">
        <input id="passwordInput" class="password" type="password" readonly autocomplete="off" aria-live="polite" aria-label="Generated password">
        <button id="toggleVisibility" aria-pressed="false" aria-label="Show password">Show</button>
      </div>

      <div class="row buttons">
        <button id="generate">Generate Password</button>
        <button id="copy" disabled>Copy</button>
      </div>

      <div class="row">
        <meter id="strength" min="0" max="4" value="0" data-level="0" aria-hidden="true"></meter>
        <span id="strengthText" class="strength-text" aria-live="polite">Very weak</span>
      </div>

      <div class="row">
        <span id="entropyText" class="entropy-text" aria-live="polite"></span>
      </div>

    </div>

    <footer>
      <small>Made with love ❤️ by Sohail Akhtar</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
