<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Secure Password Generator</h1>

    <div class="controls">

      <div class="row">
        <span>Password length: <strong id="lengthValue">16</strong></span>
        <input id="length" type="range" min="4" max="64" value="16">
      </div>

      <fieldset class="row">
        <legend>Include</legend>
        <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
        <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
        <label><input type="checkbox" id="numbers" checked> Numbers</label>
        <label><input type="checkbox" id="symbols"> Symbols</label>
      </fieldset>

      <div class="row password-row">
        <input id="passwordInput" class="password" type="password" readonly>
        <button id="toggleVisibility">Show</button>
      </div>

      <div class="row buttons">
        <button id="generate">Generate Password</button>
        <button id="copy" disabled>Copy</button>
      </div>

      <div class="row">
        <meter id="strength" min="0" max="4" value="0"></meter>
        <span id="strengthText" class="strength-text"></span>
      </div>

      <div class="row">
        <span id="entropyText" class="entropy-text"></span>
      </div>

    </div>

    <footer>
      <small>Made with love ❤️ by Sohail Akhtar</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
